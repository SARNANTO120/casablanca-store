<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر الفضاء 🚀</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ✨ النجوم (رسمة متحركة) -->
  <canvas id="stars"></canvas>

  <!-- 🌌 السديم الملوّن (الخلفية الفضائية) -->
  <div class="nebula nebula1"></div>
  <div class="nebula nebula2"></div>
  <div class="nebula nebula3"></div>

  <!-- 🌙 مشهد الفضاء: الكاميرا تزوم على القمر والفضائي يكتب -->
  <div class="scene" id="scene">
    <div class="moon-wrap">
      <div class="moon">
        <div class="crater c1"></div>
        <div class="crater c2"></div>
        <div class="crater c3"></div>
        <div class="crater c4"></div>
      </div>
    </div>

    <div class="alien-box">
      <div class="alien">👽</div>
      <div class="bubble" id="bubble"></div>
    </div>
  </div>

  <!-- 🔝 الشريط العلوي -->
  <nav class="topbar">
    <span class="nav-title" id="navStoreName">متجر الفضاء 🚀</span>
    <div class="nav-actions">
      <button id="adminPanelBtn" class="nav-btn admin-btn" hidden>🛠️ لوحة الأدمن</button>
      <div id="userChip" class="user-chip" hidden>👤 <span id="navUserName"></span></div>
      <button id="logoutBtn" class="nav-btn" hidden>🚪 خروج</button>
      <button id="loginBtn" class="nav-btn">🔑 تسجيل الدخول</button>
    </div>
  </nav>

  <!-- 🛍️ محتوى المتجر -->
  <div class="page">

    <header class="hero">
      <h1 id="storeName">متجر الفضاء 🚀</h1>
      <p>أفضل المنتجات بأفضل الأسعار… انطلق معنا إلى الفضاء! 🌠</p>
      <a class="btn" id="enterBtn" href="#store">🛸 ادخل المتجر</a>
    </header>

    <section class="products-section" id="store">
      <h2>🛍️ منتجاتنا</h2>
      <div class="grid" id="productsGrid"></div>
    </section>

    <!-- 🛠️ لوحة الأدمن (تظهر فقط عند دخول الأدمن) -->
    <section class="admin-section" id="adminSection" hidden>
      <h2>🛠️ لوحة الأدمن — نشر المنتجات</h2>
      <form id="addProductForm" class="admin-form card">
        <input id="pName" placeholder="اسم المنتج" required>
        <input id="pPrice" type="number" min="0" step="any" placeholder="السعر" required>
        <input id="pDesc" placeholder="وصف قصير للمنتج">
        <div class="img-row">
          <input id="pEmoji" placeholder="إيموجي مثل 🚀 (بدون صورة)">
          <label class="file-label">📷 اختر صورة للمنتج
            <input id="pImage" type="file" accept="image/*" hidden>
          </label>
        </div>
        <img id="imgPreview" class="img-preview" alt="معاينة الصورة" hidden>
        <button type="submit" class="btn">➕ نشر المنتج في المتجر</button>
        <p class="save-note">💾 المنتجات والحسابات تُحفظ تلقائياً في Firebase (السحابة)</p>
      </form>
      <h3>📦 المنتجات المنشورة</h3>
      <div id="adminList" class="admin-list"></div>
    </section>

    <footer>
      <p>صُنع بحب 💙 لموقع أخي الكبير — جميع الحقوق محفوظة © 2026</p>
    </footer>

  </div>

  <!-- 🔑 نافذة تسجيل الدخول / إنشاء حساب -->
  <div class="modal-overlay" id="authModal" hidden>
    <div class="modal">
      <button class="close-x" id="authClose">✖</button>
      <div class="tabs">
        <button id="tabLogin" class="tab active">🔑 دخول</button>
        <button id="tabRegister" class="tab">📝 حساب جديد</button>
      </div>

      <form id="loginForm">
        <input id="loginUser" placeholder="اسم المستخدم" required>
        <input id="loginPass" type="password" placeholder="كلمة السر" required>
        <button class="btn" type="submit">دخول</button>
      </form>

      <form id="regForm" hidden>
        <input id="regUser" placeholder="اسم المستخدم" required>
        <input id="regPass" type="password" placeholder="كلمة السر (4 أحرف على الأقل)" required>
        <input id="regPass2" type="password" placeholder="أعد كتابة كلمة السر" required>
        <button class="btn" type="submit">إنشاء الحساب</button>
      </form>

      <p id="authMsg" class="auth-msg"></p>
    </div>
  </div>

  <!-- 🔥 مكتبات Firebase (تعمل فقط عند إضافة بيانات مشروعك في script.js) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <script src="script.js"></script>
</body>
</html>
